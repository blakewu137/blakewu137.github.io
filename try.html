<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epunda+Slab:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Background Color:</h2>
    <input id="color" type="color" value="#00AAFF">
    <br>
    <br>
    <button onclick="resetBackground()">Reset Background</button>

    <h2>Font:</h2>
    <select id="fontSelector" onchange="changeFont()">
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Verdana">Verdana</option>
        <option value="cursive">Cursive</option>
        <option value="cambria">Cambria</option>
        <option value="wingdings">WingDings</option>
        <option value="fantasy">Fantasy</option>
    </select>
    <br>
    <br>
    <button onclick="resetFont()">Reset Font</button>


    <h2>Font Color:</h2>
    <input id="textcolorInput" type="color" value="#00AAFF">
    <br>
    <br>
    <button onclick="resetFontColor()">Reset Font Color</button>


    <h2>Font Size:</h2>
    <input type="radio" name="font-size" value="32px">
    <label for="32px">32px</label>
    <br>
    <input type="radio" name="font-size" value="50px">
    <label for="50px">50px</label>
    <br>
    <input type="radio" name="font-size" value="24px">
    <label for="24px">24px</label>
    <br>
    <br>
    <button onclick="resetFontSize()">Reset Font Size</button>


    <script>
        const color = document.getElementById("color")

        color.addEventListener("input", () => {
            document.body.style.backgroundColor = color.value;
        });

        const backgrounddefaultColor = "#00AAFF";

        function resetBackground() {
            document.body.style.backgroundColor = "#b1f0db";
            color.value = backgrounddefaultColor;
        };

        function changeFont() {
            const fontSelector = document.getElementById("fontSelector");
            document.body.style.fontFamily = fontSelector.value;
        };

        function resetFont() {
            document.body.style.fontFamily = "Epunda Slab";
        };

        const textcolorInput = document.getElementById("textcolorInput")

        textcolorInput.addEventListener("input", () => {
            document.body.style.color = textcolorInput.value;
        });

        const textdefaultColor = "#00AAFF";

        function resetFontColor() {
            document.body.style.color = "#000000";
            textcolorInput.value = textdefaultColor;
        };

        const fontSizeRadioButtons = document.getElementsByName("font-size")

        for (const radioButton of fontSizeRadioButtons) {
            radioButton.addEventListener("input", () => {
                const select = radioButton.value;
                document.body.style.fontSize = select
            });
        }

        function resetFontSize() {
            document.body.style.fontSize = "16px";
            
        for (const radioButton of fontSizeRadioButtons) {
        radioButton.checked = false;

        }};

    </script>
</body>

</html>
